<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PdfCraft</title>
  <link data-trunk rel="rust" data-bin="pdfcraft-web" data-cargo-profile="web-release" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-bulk-memory-opt --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f1f1f3; }
    #pdfcraft { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; z-index: 1; }
    .loading-container { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #7f7f7f; font: 14px system-ui, sans-serif; z-index: 0; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #19191c; }
      .loading-container { color: #aaaaaa; }
    }
  </style>
</head>
<body>
  <canvas id="pdfcraft"></canvas>
  <div class="loading-container">Loading PdfCraft&hellip;</div>
</body>
</html>
